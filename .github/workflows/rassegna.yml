from google.auth.transport.requests import Request

    # Sanitizzazione stringhe da eventuali spazi o parentesi quadre nei Secret
    client_id = client_id.strip().strip("[").strip("]")
    client_secret = client_secret.strip().strip("[").strip("]")
    refresh_token = refresh_token.strip().strip("[").strip("]")

    creds = Credentials(
        token=None,
        refresh_token=refresh_token,
        token_uri="https://oauth2.googleapis.com/token",
        client_id=client_id,
        client_secret=client_secret,
        scopes=["https://www.googleapis.com/auth/blogger"]
    )

    # Forziamo il refresh usando il transport Request standard
    if not creds.valid:
        creds.refresh(Request())

    blogger_service = build("blogger", "v3", credentials=creds)
