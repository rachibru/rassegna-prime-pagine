name: Rassegna Stampa Automatica

on:
  schedule:
    # Esegue ogni giorno alle 04:00 UTC (ovvero le 06:00 ora italiana CEST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Mantiene la possibilità di avviarlo manualmente quando vuoi

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4

      - name: Esegui script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python rassegna.py
