name: Rassegna Stampa Automatica

on:
  schedule:
    # Esegue ogni giorno alle 06:15 Italiane (04:15 UTC in estate / 05:15 UTC in inverno)
    - cron: '15 4 * * *'
  workflow_dispatch: # Permette anche l'esecuzione manuale

jobs:
  publish-rassegna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo_search google-genai google-api-python-client google-auth

      - name: Esecuzione Script Rassegna
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python rassegna.py
