name: Test Prime Pagine

on:
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub Actions

jobs:
  run-prime-pagine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione Script Prime Pagine
        run: python prime_pagine.py
