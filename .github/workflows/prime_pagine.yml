name: Aggiornamento Edicola Prime Pagine

on:
  schedule:
    # 04:00 UTC = 06:00 ora italiana in estate (ora legale CEST)
    # 05:00 UTC = 06:00 ora italiana in inverno (ora solare CET)
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: # Permette anche l'avvio manuale dalla scheda Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Run Prime Pagine script
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python prime_pagine.py
