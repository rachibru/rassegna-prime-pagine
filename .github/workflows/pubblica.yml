name: Automazione Rassegna Stampa

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-rassegna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa pacchetti
        run: pip install google-generativeai requests beautifulsoup4

      - name: Esegui script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python rassegna.py
